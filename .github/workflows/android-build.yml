name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Build (logged)
        shell: bash
        run: |
          set -o pipefail
          {
            echo "== workload install =="
            dotnet workload install maui-android
            echo "== restore =="
            dotnet restore
            echo "== publish =="
            dotnet publish -f net8.0-android -c Release -p:AndroidPackageFormat=apk
          } 2>&1 | tee build.log

      - name: Push log + APK to artifacts branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          cp bin/Release/net8.0-android/publish/*-Signed.apk /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b artifacts
          git config user.email "ci@github"; git config user.name "CI"
          git add -A && git commit -qm "run ${{ github.run_number }} ${{ job.status }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifacts

      - name: Release APK on success
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "SL Mobile Viewer APK"
          files: bin/Release/net8.0-android/publish/*-Signed.apk
