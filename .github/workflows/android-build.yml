name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Build (logged)
        shell: bash
        run: |
          set -o pipefail
          {
            echo "== workload install =="
            dotnet workload install maui-android
            echo "== restore =="
            dotnet restore
            echo "== publish =="
            dotnet publish -f net8.0-android -c Release -p:AndroidPackageFormat=apk
          } 2>&1 | tee build.log

      - name: Publish log (and APK if built) as release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag-${{ github.run_number }}
          name: "Build ${{ github.run_number }} output"
          files: |
            build.log
            bin/Release/net8.0-android/publish/*-Signed.apk

      - name: Also keep apk-latest tag on success
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "SL Mobile Viewer APK"
          files: bin/Release/net8.0-android/publish/*-Signed.apk
