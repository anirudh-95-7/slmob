name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Build and publish outputs (self-reporting)
        shell: bash
        run: |
          set +e
          echo "== env ==" > build.log
          df -h / >> build.log 2>&1
          free -m >> build.log 2>&1
          echo "== workload ==" >> build.log
          dotnet workload install maui-android >> build.log 2>&1
          echo "workload_exit=$?" >> build.log
          echo "== restore ==" >> build.log
          dotnet restore >> build.log 2>&1
          echo "restore_exit=$?" >> build.log
          echo "== publish ==" >> build.log
          dotnet publish -f net8.0-android -c Release -p:AndroidPackageFormat=apk -v minimal >> build.log 2>&1
          PUB=$?
          echo "publish_exit=$PUB" >> build.log
          df -h / >> build.log 2>&1

          # ---- self-report: push results no matter what happened above ----
          mkdir -p /tmp/out
          echo "run ${{ github.run_number }} publish_exit=$PUB" > /tmp/out/status.txt
          grep -E "error [A-Z]+[0-9]+|error CS|MSB[0-9]+|_exit=" build.log | sort -u | head -60 > /tmp/out/errors.txt
          tail -c 200000 build.log > /tmp/out/build.log
          apk=$(ls bin/Release/net8.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          if [ -n "$apk" ]; then
            cp "$apk" /tmp/apk.apk
            ( cd /tmp/out && split -b 4m -d /tmp/apk.apk apkchunk_ \
              && sha256sum /tmp/apk.apk | cut -d' ' -f1 > apk.sha256 \
              && basename "$apk" > apk.name )
          fi
          cd /tmp/out
          git init -q -b artifacts
          git config user.email "ci@github"; git config user.name "CI"
          git add -A
          git commit -qm "run ${{ github.run_number }} publish_exit=$PUB"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifacts
          echo "artifact_push_exit=$?"
          exit $PUB
